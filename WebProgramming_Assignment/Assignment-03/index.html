<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Billing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Hospital Management Billing System</h2>

    <label>Patient Name:</label>
    <input type="text" id="patientName" placeholder="Enter patient name">

    <br><br>

    <label>Cabin Type:</label>

    <select id="cabin">
        <option value="1000">General - 1000 Tk/day</option>
        <option value="2000">Semi Deluxe - 2000 Tk/day</option>
        <option value="3500">Deluxe - 3500 Tk/day</option>
    </select>

    <br><br>

    <label>Number of Days:</label>
    <input type="number" id="days" placeholder="Enter days">

    <br><br>

    <label>Medicine Cost:</label>
    <input type="number" id="medicine" placeholder="Enter medicine cost">

    <br><br>

    <label>Test Cost:</label>
    <input type="number" id="test" placeholder="Enter test cost">

    <br><br>

    <button onclick="generateBill()">Generate Bill</button>

    <div id="result"></div>

    <script src="script.js"></script>

</body>
</html>
