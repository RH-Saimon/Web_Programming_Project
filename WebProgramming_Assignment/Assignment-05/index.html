<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Payroll System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Employee Payroll System</h2>

    <label>Employee Name:</label>
    <input type="text" id="name" placeholder="Enter employee name">

    <br><br>

    <label>Basic Salary:</label>
    <input type="number" id="salary" placeholder="Enter basic salary">

    <br><br>

    <label>Overtime Hours:</label>
    <input type="number" id="overtime" placeholder="Enter overtime hours">

    <br><br>

    <button onclick="calculateSalary()">Calculate Salary</button>

    <div id="result"></div>

    <script src="script.js"></script>

</body>
</html>
