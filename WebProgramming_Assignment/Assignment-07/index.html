<!DOCTYPE html>
<html>
<head>
    <title>Student Result Processing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Result Processing System</h1>

    <lebel>Student Name:</lebel>
    <input type="text" id="studentName" placeholder="Enter your name">

    <h2>Enter Subject Marks (Out of 100)</h2>

    <div class="subject-row">
        <label>Java:</label>
        <input type="number" id="java" min="0" max="100">
    </div>

    <div class="subject-row">
        <label>Database:</label>
        <input type="number" id="database" min="0" max="100">
    </div>

    <div class="subject-row">
        <label>Networking:</label>
        <input type="number" id="networking" min="0" max="100">
    </div>

    <div class="subject-row">
        <label>AI:</label>
        <input type="number" id="ai" min="0" max="100">
    </div>

    <div class="subject-row">
        <label>Web Engineering:</label>
        <input type="number" id="web" min="0" max="100">
    </div>

    <button onclick="calculateResult()">Calculate Result</button>

    <div id="result"></div>

    <script src="script.js"></script>

</body>
</html>
