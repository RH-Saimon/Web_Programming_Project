<!DOCTYPE html>
<html>
<head>
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Inventory Management System</h1>

    <div class="container">

        <label>Product Name:</label>
        <input type="text" id="productName" placeholder="Enter product name">

        <br><br>

        <label>Purchase Price:</label>
        <input type="number" id="purchasePrice" min="0" placeholder="Enter purchase price">

        <br><br>

        <label>Selling Price:</label>
        <input type="number" id="sellingPrice" min="0" placeholder="Enter selling price">

        <br><br>

        <label>Quantity:</label>
        <input type="number" id="quantity" min="1" placeholder="Enter quantity">

        <br><br>

        <button onclick="addProduct()">Add Product</button>

        <h2>Inventory Summary</h2>

        <p>Total Stock Value: <span id="stockValue">0</span> Tk</p>

        <p>Expected Revenue: <span id="revenue">0</span> Tk</p>

        <p>Expected Profit: <span id="profit">0</span> Tk</p>

        <h2>Product List</h2>

        <table>
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Purchase Price</th>
                    <th>Selling Price</th>
                    <th>Quantity</th>
                    <th>Stock Value</th>
                    <th>Revenue</th>
                    <th>Profit</th>
                </tr>
            </thead>

            <tbody id="productTable">
            </tbody>
        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
